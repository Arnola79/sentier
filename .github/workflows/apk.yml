name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Synchroniser le projet Android
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Résumer l'erreur de compilation
        if: failure()
        run: |
          msg=$(grep -E "error:|What went wrong|Caused by|Could not|FAILURE|not found|Unsupported" build.log | head -15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle::${msg}"

      - name: Nommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sentier.apk

      - name: Construire la version HTML autonome
        run: |
          sed -e 's#href="leaflet/leaflet.css"#href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"#' \
              -e 's#src="leaflet/leaflet.js"#src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"#' \
              www/index.html > sentier.html
          if grep -q '"leaflet/' sentier.html; then echo "::error::Leaflet local encore référencé dans sentier.html"; exit 1; fi

      - name: Mettre à jour html/sentier.html dans le dépôt
        run: |
          mkdir -p html && cp sentier.html html/sentier.html
          if ! git diff --quiet -- html/sentier.html || [ -n "$(git status --porcelain html)" ]; then
            git add html/sentier.html
            git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Met à jour html/sentier.html (build n°${{ github.run_number }}) [skip ci]"
            git pull -q --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sentier-apk
          path: |
            sentier.apk
            sentier.html

      - name: Publier dans la release « apk-latest »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest sentier.apk sentier.html \
            --title "Sentier : dernière version" \
            --notes "Build n°${{ github.run_number }}. sentier.apk : l'application Android, à ouvrir pour l'installer. sentier.html : la même application en page web, à ouvrir dans un navigateur sur téléphone ou PC (connexion internet nécessaire)."
