name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Synchroniser le projet Android
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Résumer l'erreur de compilation
        if: failure()
        run: |
          msg=$(grep -E "error:|What went wrong|Caused by|Could not|FAILURE|not found|Unsupported" build.log | head -15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle::${msg}"

      - name: Nommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sentier.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sentier-apk
          path: sentier.apk

      - name: Publier dans la release « apk-latest »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest sentier.apk \
            --title "Sentier : dernier APK" \
            --notes "APK compilé automatiquement (build n°${{ github.run_number }}). Télécharge sentier.apk puis ouvre-le pour l'installer."
